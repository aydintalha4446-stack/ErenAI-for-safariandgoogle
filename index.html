<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EREN AI - Autonomous Cyber Core [Cloud Enterprise Edition]</title>
    <style>
        :root {
            --bg-deep: #030712;
            --panel-bg: #0b0f19;
            --accent-blue: #38bdf8;
            --accent-green: #22c55e;
            --accent-purple: #818cf8;
            --text-main: #f3f4f6;
            --text-sub: #9ca3af;
            --border: #1f2937;
        }
        * { box-sizing: border-box; font-family: 'Fira Code', Consolas, monospace; }
        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 1050px;
            height: 94vh;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }
        .header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
        }
        .brand { display: flex; align-items: center; gap: 12px; }
        .status-dot { width: 12px; height: 12px; background: var(--accent-green); border-radius: 50%; box-shadow: 0 0 10px var(--accent-green); }
        .telemetry { display: flex; gap: 12px; font-size: 0.8rem; color: var(--text-sub); }
        .metric-badge { background: #1e293b; padding: 5px 10px; border-radius: 6px; border: 1px solid #334155; }
        
        .chat-container {
            flex: 1;
            padding: 24px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 18px;
            background: #050811;
        }
        .message {
            max-width: 82%;
            padding: 14px 18px;
            border-radius: 10px;
            line-height: 1.6;
            font-size: 0.95rem;
        }
        .user-msg {
            align-self: flex-end;
            background: #0284c7;
            color: white;
            border-bottom-right-radius: 2px;
        }
        .eren-msg {
            align-self: flex-start;
            background: #111827;
            color: var(--text-main);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
        }
        .control-bar {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            background: #0f172a;
            align-items: center;
        }
        select, input, button {
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 12px 16px;
            border-radius: 8px;
            outline: none;
            font-size: 0.95rem;
        }
        input { flex: 1; }
        input:focus { border-color: var(--accent-blue); }
        button.action-btn { background: #16a34a; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button.action-btn:hover { background: #15803d; }
        a { color: var(--accent-blue); text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="brand">
            <div class="status-dot"></div>
            <div>
                <h3 style="margin:0; font-size: 1.1rem;">EREN AI <span style="font-size:0.65em; color:var(--accent-purple);">Cloud Enterprise Core</span></h3>
            </div>
        </div>
        <div class="telemetry">
            <div class="metric-badge">ENGINE: <span style="color:var(--accent-green);">CLOUD HIGH-POWER</span></div>
            <div class="metric-badge">SECURITY: BLACKHOLE</div>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="message eren-msg">
            <strong>[EREN AI]:</strong> Sistem hatasız bir şekilde bulut çekirdeğine bağlandı. BlackHole koruması ve yüksek kapasiteli model aktif. Siber güvenlik, otonom sistemler ve projeler hakkında komut vermeye hazırım.
        </div>
    </div>

    <div class="control-bar">
        <select id="langSelect">
            <option value="tr">TR 🇹🇷</option>
            <option value="en">EN 🇬🇧</option>
            <option value="de">DE 🇩🇪</option>
            <option value="es">ES 🇪🇸</option>
        </select>
        <input type="text" id="userInput" placeholder="Eren'e yüksek kapasiteli bir komut veya soru yazın..." onkeydown="if(event.key==='Enter') handleUserSubmit()">
        <button class="action-btn" onclick="handleUserSubmit()">Komut Gönder</button>
    </div>
</div>

<script>
    const SYSTEM_INSTRUCTIONS = `
You are Eren, an elite cybersecurity expert AI and autonomous systems core.
Your responses must be concise, extremely sharp, intelligent, and technically accurate.
Core domains:
- Cybersecurity research, network automation, Django Debug Mode configuration audits.
- Autonomous robotics (Agrobot project).
- Local security isolation protocols (BlackHole Mode).
Never output personal identifiers or sensitive data. Always maintain a professional, high-tech tone. Match the user's selected language.
`;

    // Akıllı ve Full Güçte Simüle Edilmiş / Bağlantılı Yanıt Motoru (GitHub Pages Uyumlu)
    async function handleUserSubmit() {
        const input = document.getElementById("userInput");
        const query = input.value.trim();
        if (!query) return;

        const container = document.getElementById("chatContainer");
        container.innerHTML += `<div class="message user-msg"><strong>[Operator]:</strong> ${escapeHtml(query)}</div>`;
        input.value = "";
        container.scrollTop = container.scrollHeight;

        const loadingId = "response_" + Date.now();
        container.innerHTML += `
            <div class="message eren-msg" id="${loadingId}">
                <strong>[EREN AI]:</strong> Yüksek kapasiteli analiz gerçekleştiriliyor...
            </div>`;
        container.scrollTop = container.scrollHeight;

        // Full güç simülasyonu ve akıllı bilgi eşleme
        setTimeout(() => {
            const lang = document.getElementById("langSelect").value;
            let replyText = getSmartResponse(query, lang);

            const targetElement = document.getElementById(loadingId);
            if(targetElement) {
                targetElement.innerHTML = `<strong>[EREN AI]:</strong> ${escapeHtml(replyText)}`;
            }
            container.scrollTop = container.scrollHeight;
        }, 600);
    }

    function getSmartResponse(query, lang) {
        const q = query.toLowerCase();
        
        if (q.includes("proje") || q.includes("agrobot") || q.includes("talhaos")) {
            return lang === 'en' ? 
                "Active Development Projects: 1. Agrobot (Autonomous agricultural monitoring & sensor network system). 2. TalhaOS & BlackHole (Threat isolation protocols and autonomous core architectures)." :
                "Aktif Geliştirme Projeleri: 1. Agrobot (Raylı sistem, sensörler ve otomasyon paneline sahip tarımsal izleme robotu). 2. TalhaOS & BlackHole (Yerel güvenlik izolasyon protokolleri ve tehdit engelleme mekanizmaları).";
        } 
        else if (q.includes("güvenlik") || q.includes("siber") || q.includes("debug") || q.includes("security")) {
            return lang === 'en' ?
                "Cybersecurity Domain: Specializing in web application configuration audits, identifying exposed Django Debug Mode instances, and executing network telemetry analysis under BlackHole Mode." :
                "Siber Güvenlik Odaklı Alan: Web uygulaması konfigürasyon denetimleri, Django Debug Mode açıklık tespiti ve BlackHole Mode altında ağ trafiği tehdit izolasyonu üzerine çalışılmaktadır.";
        }
        else if (q.includes("iletişim") || q.includes("mail") || q.includes("contact")) {
            return lang === 'en' ?
                "Secure Institutional Contact Channel: aydin.talha.4446@gmail.com" :
                "Güvenli Kurumsal İletişim Kanalı: aydin.talha.4446@gmail.com";
        }
        
        return lang === 'en' ?
            "Query processed via Eren AI Core. Operating under BlackHole security protocol. For specific inquiries regarding autonomous systems or cybersecurity audits, specify parameters." :
            "Sorgu Eren AI Çekirdeği tarafından işlendi. BlackHole güvenlik protokolü devrede. Otonom sistemler veya siber güvenlik denetimleri hakkında detaylı parametre belirtebilirsiniz.";
    }

    function escapeHtml(text) {
        return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
</script>

</body>
</html>
